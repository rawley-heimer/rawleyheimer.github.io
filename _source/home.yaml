about:
  - >-
    Professor Rawley Heimer is an expert in financial markets whose research examines how households
    build and lose financial security through their decisions in investment and credit markets. His
    research shows how social networks shape investor behavior, how leverage drives retail investors’
    trading and affects financial markets, and how mistaken beliefs distort saving and investment over
    the life cycle. Current work examines how AI affects personal finances. He also studies real estate
    markets, including mortgage lending and institutional investment in housing.
  - >-
    His research is published in leading finance and economics journals and has received numerous
    awards, including the Dimensional Fund Advisors Distinguished Paper Award at the <i>Journal of
    Finance</i> and the Rising Scholar Award at the <i>Review of Financial Studies</i>. This research
    has been featured in <i>Bloomberg News</i>, the <i>Financial Times</i>, <i>Forbes</i>, and the
    <i>Wall Street Journal</i>, among others.
  - >-
    Prof. Heimer is an Associate Editor at <i>Management Science</i>, the <i>Review of Corporate
    Financial Studies</i>, and <i>Financial Management</i>. Outside of academia, he was formerly an
    economist at the Federal Reserve Bank and served as Senior Advisor for Research and Policy at the
    Consumer Financial Protection Bureau. He frequently gives presentations to asset managers and
    supports litigation in areas such as consumer banking, financial markets, and digital assets.

