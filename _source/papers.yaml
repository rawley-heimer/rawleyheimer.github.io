  abstract: >-
    We develop modified benchmarking tests for disparate treatment that we apply to 25 years of mortgage
    lending. Our tests limit the scope for omitted variables by linking high-frequency mortgage decisions
    to an economic mechanism — loan officers have volume quotas that cause increased approval rates at
    month-end. We estimate that these quotas at least halve the unexplained 7 ppt Black approval gap.
    Loan officers more likely to miss their quotas have larger increases in Black approvals. Suggesting
    supply-side mechanisms, applications arrive at a constant rate within-month, and neither differences
    in credit risk nor applicant preferences explain the month-end decline in racial differences.
  lead: >-
    Racial disparities in lending emerge in part from how lenders make decisions: when month-end volume
    quotas push loan officers to approve more loans, the unexplained racial gap in mortgage approvals
    shrinks by at least half.
  brief: >-
    Studying 25 years of mortgage lending, the authors develop a new test for disparate treatment: approval
    rates rise at the end of each month as loan officers try to hit their quotas, and they estimate these
    quotas at least halve the unexplained 7-percentage-point gap in approval rates for Black applicants.
    Loan officers more likely to miss their quotas show larger increases in Black approvals. Because applications
    arrive at a steady rate through the month and neither credit risk nor applicant preferences explain
    the pattern, the evidence points to supply-side (lender) mechanisms.
