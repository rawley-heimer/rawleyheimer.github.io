  brief: >-
    A 1953 federal law gave state courts authority over civil disputes on some Native American reservations,
    while tribal courts kept that authority on others. Although the two groups of reservations were economically
    similar when the law passed, those under state courts grew significantly faster over the long run.
    The gap is driven by the poorest reservations with tribal courts, and specifically by those where
    court enforcement was most uncertain.
