  year: '2022'
  date: 2022-12
  doi: 10.1016/j.jfineco.2022.09.008
  jel: D14, D15, G51, N52
  links:
  - label: Published version
    source: Journal of Financial Economics
    url: https://www.sciencedirect.com/science/article/pii/S0304405X22002069
  - label: Working paper version
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3682223
  - label: Earlier version
    source: NBER Working Paper 27782
    url: https://www.nber.org/papers/w27782
  abstract: >-
    Using individual credit bureau data matched with cash windfalls from fracking, we estimate that windfall
    recipients reduce debt-to-income by 2.4 percentage points relative to no-windfall controls. Debt repayment
    effects are 3 times stronger for subprime individuals than for prime individuals. Based on the timing
    of upfront versus continuing cash payments, debt repayment coincides with the timing of payments but
    not with news about future payments. These findings present a challenge for purely forward-looking
    models of debt. Indeed, when we incorporate a windfall shock into a forward-looking model, the model
    predicts an increase in debt that runs counter to our evidence of debt repayment.
  lead: >-
    When households receive a sudden cash windfall, many use it to pay down debt rather than borrow more,
    a pattern that purely forward-looking models of household debt struggle to explain.
  brief: >-
    Matching individual credit bureau records to royalty payments from shale oil and gas drilling (fracking),
    the paper finds that windfall recipients cut their debt-to-income ratio by 2.4 percentage points relative
    to similar people who received nothing, and the effect is three times larger for subprime borrowers
    than for prime borrowers. Repayment tracks when the cash actually arrives, not when people learn that
    future payments are coming. That pattern is hard to square with purely forward-looking models of borrowing,
    which predict that debt should rise after good news about future income.
  keywords: >-
    income shocks, liquidity constraints, marginal propensity to consume, cash windfalls, household debt,
    debt repayment, fracking, shale royalties, credit bureau data, subprime borrowers, permanent income
    hypothesis
  topics:
  - consumer-credit-debt
  - saving-retirement-inheritance
  finding: >-
    Households use cash windfalls mainly to pay down debt, timed to when cash arrives rather than to news
    of future income, which challenges forward-looking models of household debt; evidence from shale drilling
    payments.
  glance:
