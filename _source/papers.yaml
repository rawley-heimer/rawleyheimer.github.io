  abstract: >-
    Early-life exposure to local financial institutions increases household financial inclusion and leads
    to long-term improvements in consumer credit outcomes. We identify the effect of local financial markets
    using Congressional legislation that led to unintended differences in financial market development
    across Native American reservations. Individuals from financially underdeveloped reservations enter
    consumer credit markets later, and upon reaching adulthood, have 10 point lower credit scores and
    4 percentage point more delinquent accounts. These effects are long-lived and depreciate slowly after
    individuals move to more developed areas. Formative exposures to local banking improve consumer credit
    behavior by increasing financial literacy and financial trust.
  lead: >-
    Growing up near banks and other financial institutions has lasting benefits for people’s financial
    lives.
  brief: >-
    Congressional legislation created unintended differences in financial development across Native American
    reservations, which the paper uses to isolate the effect of local financial markets. People from financially
    underdeveloped reservations enter credit markets later and, as adults, have credit scores about 10
    points lower and 4 percentage points more delinquent accounts; these effects fade only slowly even
    after they move to more developed areas. Early exposure to local banking appears to work by building
    financial literacy and trust in financial institutions.
  keywords: >-
    local banking, bank branches, banking deserts, access to finance, financial inclusion, financial development,
    credit scores, financial literacy, trust in banks, Native American reservations, early-life exposure,
    consumer credit
  topics:
