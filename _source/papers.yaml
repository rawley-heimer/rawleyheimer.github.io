  title: 'Fallible Firms: The Economics of Consumer Redress'
  authors:
  - Charlotte Haendler
  - Rawley Z. Heimer
  kind: working
  status: working
  year: '2025'
  date: 2025-04
  links:
  - label: Working paper
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5218602
  abstract: >-
    Financial disputes are a widespread but understudied feature of consumer financial markets. Using
    confidential data from the Consumer Financial Protection Bureau (CFPB), we analyze nearly two million
    consumer complaints filed since 2014, which have led to an average payout of $1,470 per successful
    complaint. The volume of complaints and total restitution have increased substantially over time,
    suggesting significant scope for additional compensation. When understanding who secures restitution
    — and why — we find little evidence that differences across firms systematically drive restitution
    outcomes. Instead, product complexity and consumer engagement play key roles: consumers with higher
    income and education (high-SES) are more likely to explicitly request refunds, claim fraud, and submit
    supporting documentation, making firms more responsive. Leveraging previously unexamined CFPB monitoring
    reviews, where the agency systematically screens company responses and issues confidential reports
    highlighting deficiencies, we show that regulatory scrutiny increases restitution but disproportionately
    benefits high-SES consumers, reinforcing individual-specific mechanisms. Our results highlight the
    complementary nature of regulatory interventions and suggest that financial sophistication and self-advocacy
    are critical determinants of consumer redress.
  lead: >-
    Access to redress is unequal: who gets money back after a complaint about a financial firm depends
    more on the consumer than on the firm.
  brief: >-
    Using confidential Consumer Financial Protection Bureau (CFPB) data on nearly two million complaints
    filed since 2014, the paper finds that successful complaints pay out $1,470 on average and that total
    restitution has grown substantially over time. Differences across firms explain little; instead, higher-income
    and more educated consumers are more likely to request refunds, allege fraud, and submit documentation,
    and firms respond to them more. CFPB monitoring raises restitution but disproportionately benefits
    these higher-socioeconomic-status consumers.
  keywords: >-
    inequality, consumer complaints, CFPB, financial restitution, consumer redress, financial sophistication,
    regulatory supervision, consumer protection
  topics:
  - consumer-protection-regulation
  - consumer-credit-debt
  - legal-regulatory-institutions
  finding: >-
