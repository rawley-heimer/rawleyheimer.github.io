  abstract: >-
    Institutional investors in single-family housing markets are often represented as worsening household
    well-being. We document the growth of single-family REITs (SFRs) and their (non-)effects on housing
    markets by constructing a novel dataset of SFRs’ underlying properties. SFRs purchase properties in
    neighborhoods encircling city centers, where housing supply is more elastic, and with populations
