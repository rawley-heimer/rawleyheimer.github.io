    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5331388
  abstract: >-
    Rising differences in generational wealth and the economic effects of inheritances make it increasingly
    important to understand individuals’ bequest motives. We document five novel empirical facts about
    individuals’ preferences and expectations toward bequests using survey data spanning three decades.
    (1) Households with heirs exhibit stronger bequest preferences. (2) Bequest motives follow a U-shaped
    pattern over the life cycle. (3) The perceived importance of bequests rises sharply among the top
    two deciles of the wealth distribution. (4) Stock owners, particularly those who experience high market
    returns, report stronger bequest preferences. (5) Individuals systematically overestimate their bequests’
    likelihood and size. These stylized facts provide new benchmarks for evaluating economic models and
    suggest that alternatives to the static treatment of bequest motives may better reflect observed behavior.
    Finally, we examine the implications of these findings for wealth accumulation and portfolio choice
    within a canonical life-cycle model with precautionary savings.
  lead: >-
    Bequest motives, a key ingredient in models of saving and wealth inequality, follow five robust empirical
    patterns.
  brief: >-
    People with heirs care more about bequests; the importance of bequests follows a U-shape over the
    life cycle; it rises sharply among the wealthiest fifth of households; stock owners, especially those
    who have enjoyed high market returns, care more about bequests; and people systematically overestimate
    how likely and how large their bequests will be. These facts give economic models new benchmarks and
    suggest that bequest motives change over time rather than staying fixed. The paper also works through
    what the facts imply for wealth accumulation and portfolio choice in a life-cycle model.
  keywords: >-
    saving, bequest motives, inheritances, intergenerational wealth, life-cycle model, wealth inequality,
    portfolio choice, subjective expectations
  topics:
