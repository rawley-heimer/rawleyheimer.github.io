  title: 'Pushing Boundaries: Political Redistricting and Consumer Credit'
  authors:
  - Pat Akey
  - Christine Dobridge
  - Rawley Z. Heimer
  - Stefan Lewellen
  kind: working
  status: working
  year: '2017'
  date: 2017-09
  links:
  - label: Working paper
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3031604
  abstract: >-
    Consumers lose access to credit when their congressional district boundaries are irregularly redrawn
    to benefit a political party (i.e., are gerrymandered). We identify this effect by matching a longitudinal
    panel of consumer credit data with changes in congressional district boundaries following decennial
    censuses. Reductions in credit access are concentrated in states that allow elected politicians to
    draw political boundaries and in districts where subsequent congressional elections are less competitive.
    We find similar reductions in credit access when state senate district boundaries are irregularly
    redrawn and when states make it more difficult for constituents to vote. Overall, our findings are
    consistent with theories suggesting that less-competitive political races reduce politicians’ incentives
    to cater to their constituents’ preferences.
  lead: >-
