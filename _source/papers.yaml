        NYSE minimum commission schedules before deregulation in 1975, set as a function of stock price
    - - Data
      - Historical NYSE commission schedules and stock trading volume
    - - Method
      - >-
        Regression kink design at schedule kinks; difference-in-differences around schedule revisions
    effects_title: Reported effects
    numeric: false
    effects:
    - - Trading volume response to a 1% rise in commissions
