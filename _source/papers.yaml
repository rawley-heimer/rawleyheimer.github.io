  title: 'Shale Shocked: Cash Windfalls and Household Debt Repayment'
  authors:
  - J. Anthony Cookson
  - Erik P. Gilje
  - Rawley Z. Heimer
  kind: article
  status: published
  journal: Journal of Financial Economics
  volume: '146'
  issue: '3'
