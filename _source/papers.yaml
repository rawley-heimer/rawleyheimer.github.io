  year: '2019'
  date: 2019-12
  doi: 10.1111/jofi.12828
  awards:
  - Dimensional Fund Advisors Distinguished Paper Award
  - TIAA Paul A. Samuelson Award Finalist
  links:
  - label: Published version
    source: Journal of Finance
    url: https://onlinelibrary.wiley.com/doi/full/10.1111/jofi.12828
  - label: Working paper version
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2669484
  abstract: >-
    We study the effect of subjective mortality beliefs on life-cycle behavior. With new survey evidence,
    we document that survival is underestimated by the young and overestimated by the old. We calibrate
    a canonical life-cycle model to elicited beliefs. Relative to calibrations using actuarial probabilities,
    the young under-save by 26%, and retirees draw down their assets 27% slower, while the model’s fit
    to consumption data improves by 88%. Cross-sectional regressions support the model’s predictions:
    distorted mortality beliefs correlate with savings behavior while controlling for risk preferences,
    cognitive, and socioeconomic factors. Overweighting the likelihood of rare events contributes to mortality
    belief distortions.
  lead: >-
    Beliefs about survival act like time discounting in the life-cycle model: because young people underestimate
    and older people overestimate their chances of living, the young save too little and retirees spend
    down their savings too slowly.
  brief: >-
    New survey evidence shows that young people underestimate their chances of survival while older people
    overestimate theirs. Feeding these beliefs into a standard life-cycle model, the young under-save
    by 26% and retirees draw down assets 27% more slowly than they would using actuarial survival odds,
    and the model’s fit to real consumption data improves by 88%. The distortions are linked to overweighting
    the likelihood of rare events.
  keywords: >-
    time discounting, time preference, discount rates, consumption puzzles, subjective mortality beliefs,
    life expectancy, life-cycle model, retirement saving, undersaving, asset decumulation, probability
    weighting, survey evidence
  topics:
  - saving-retirement-inheritance
  - behavioral-finance-beliefs
  finding: >-
    Subjective survival beliefs work like age-varying time discounting in the life-cycle model, helping
    explain why the young under-save and retirees draw down their assets slowly.
  glance:
    design:
    - - Question
      - >-
        How do subjective survival beliefs, which act like time discounting, shape saving and spending
        over the life cycle?
    - - Data
      - New survey evidence on subjective survival beliefs
    - - Method
      - >-
        A canonical life-cycle model calibrated to elicited beliefs versus actuarial probabilities; cross-sectional
        regressions
    effects_title: Reported effects of using elicited beliefs
    numeric: true
