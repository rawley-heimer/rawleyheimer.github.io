- slug: brokerage-commissions-trading-volume
  order: 22
  bibkey: heimer2026brokerage
  request: true
  title: 'Brokerage Commissions and Trading Volume: Lessons from the 20th Century'
  authors:
  - Valeria Fedyk
  - Rawley Z. Heimer
  kind: working
  status: unposted
  year: '2026'
  date: 2026-08
  jel: G11, G12, G17
  links: []
  abstract: >-
    We ask how brokerage commissions affect trading activity. Estimating this causal effect is difficult
    because commissions are typically endogenous to the market. We turn to the pre-1976 era, when the
    New York Stock Exchange set and repeatedly revised minimum commission schedules, with commission rates
    a deterministic function of a stock’s price. This institutional feature delivers two complementary
    identification strategies. First, we exploit discontinuities in the price-based commission schedule
    in a regression kink design: higher commission rates raise trading volume, with a 1% increase in commissions
    increasing volume by approximately between 0.15% and 0.40%. Second, we exploit discrete changes in
    the schedule in a difference-in-differences design around rule revisions: trading volume declines
    in advance of new commission rules and then increases by 0.11–0.14% upon implementation. Both designs
    point to economically meaningful increases in trading activity, concentrated in more volatile stocks.
    We rationalize these findings with a mechanism in which fixed minimum commission schedules facilitate
    anti-competitive brokerage behavior: by limiting price competition, they increase the incentives and
    scope for brokers to steer naïve investors toward high-commission stocks, amplifying speculative trading
    precisely where volatility is highest.
  lead: >-
    Higher trading costs do not always mean less trading: when brokerage commissions were fixed, higher
    commissions raised trading volume as brokers steered clients toward high-commission stocks.
  brief: >-
    Before commissions were deregulated in 1975, NYSE minimum commissions were a fixed function of a stock’s
    price, with kinks in the schedule and periodic revisions. Exploiting both, the paper finds that a
    1% increase in commissions raised trading volume by roughly 0.15% to 0.40%, with effects concentrated
    in more volatile stocks. The authors attribute this to brokers: fixed schedules limited price competition
    and gave brokers the incentive and room to steer naïve investors toward high-commission stocks.
  keywords: >-
    conflicts of interest, retail investors, brokerage commissions, trading costs, trading volume, fixed
    commissions, NYSE, May Day 1975, market microstructure, broker incentives, volatility
  topics:
  - retail-investing-brokerage
  - consumer-protection-regulation
  finding: >-
    Higher trading costs can increase trading: under fixed NYSE commission schedules, higher commissions
    raised volume, consistent with brokers steering investors toward high-commission stocks.
  glance:
