  abstract: >-
    Social interaction contributes to some traders’ disposition effect. New data from an investment-specific
    social network linked to individual-level trading records builds evidence of this connection. To credibly
    estimate causal peer effects, I exploit the staggered entry of retail brokerages into partnerships
    with the social trading web platform and compare trader activity before and after exposure to these
    new social conditions. Access to the social network nearly doubles the magnitude of a trader’s disposition
    effect. Traders connected in the network develop correlated levels of the disposition effect, a finding
    that can be replicated using workhorse data from a large discount brokerage.
  lead: >-
    Social interaction amplifies investors’ behavioral biases: it makes them more prone to the disposition
    effect, selling winning positions too soon and holding on to losers.
  brief: >-
    Using an investment-focused social network linked to individual trading records, and exploiting the
    staggered timing with which brokerages partnered with the platform, the paper finds that gaining access
    to the network nearly doubles a trader’s disposition effect. Traders who are connected in the network
    develop similar levels of the bias, a pattern that also shows up in standard data from a large discount
    brokerage.
