  links:
  - label: Published version
    source: Review of Financial Studies
    url: https://academic.oup.com/rfs/article/35/4/1643/6308957
  - label: Working paper version
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3300456
  abstract: >-
    We show that constraints can improve financial decision-making by disciplining behavioral biases.
    In financial markets, restrictions on leverage limit traders’ ability to borrow to open new positions.
    We demonstrate that regulation that restricts the provision of leverage to retail traders improves
    trading performance. By increasing the opportunity cost of postponing the realization of losses, leverage
    constraints improve traders’ market timing and reduce their disposition effect. We replicate these
    findings in two distinct experimental settings, further isolating the mechanism and demonstrating
    generality of the results. The interaction between constraints and behavioral biases has implications
    for policy and choice architecture.
  lead: >-
    Restricting people’s choices can improve their financial decisions by disciplining their behavioral
    biases.
  brief: >-
    Studying a regulation that restricted how much leverage retail traders could use, the paper finds
    that constrained traders had better market timing and a weaker disposition effect — the tendency to
    sell winners too soon and hold on to losers. The mechanism is opportunity cost: when borrowing is
    limited, keeping a losing position open ties up capital that could fund new trades, so putting off
    a loss becomes more expensive. Two separate experiments reproduce the result, suggesting that well-designed
    constraints can work as a form of choice architecture.
  keywords: >-
    debiasing, paternalism, retail investors, retail trading, margin and leverage, leverage constraints,
    disposition effect, behavioral biases, retail traders, financial regulation, choice architecture,
    experiments, social trading network
  topics:
  - retail-investing-brokerage
  - behavioral-finance-beliefs
  - consumer-protection-regulation
  - social-media-finance
  finding: >-
    Constraints can reduce financial mistakes: leverage limits improved traders’ performance by curbing
    the disposition effect, in retail trading data and in two experiments.
  glance:
    design:
    - - Question
      - Can limits on borrowing reduce investors’ behavioral biases?
    - - Setting
      - A regulation restricting the leverage available to retail traders
    - - Data
      - Retail forex trading records from a social trading network, and two experimental settings
    - - Method
      - Trading before and after the leverage restriction; replication in two experiments
    effects_title: Main findings
    numeric: false
    effects:
    - - Trading performance
      - Improves under leverage constraints
    - - Market timing
      - Improves
    - - Disposition effect
      - Declines
    - - Mechanism
      - Constraints raise the opportunity cost of postponing realized losses
  contributes:
  - debiasing and choice architecture
  - paternalism and the welfare effects of financial regulation
  - the disposition effect
  - margin and leverage regulation
