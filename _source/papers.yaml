- slug: dynamic-inconsistency-risky-choice
  order: 1
  selected: true
  bibkey: heimer2025dynamic
  title: 'Dynamic Inconsistency in Risky Choice: Evidence from the Lab and Field'
  authors:
  - Rawley Z. Heimer
  - Zwetelina Iliewa
  - Alex Imas
  - Martin Weber
  kind: article
  status: published
  journal: American Economic Review
  volume: '115'
  issue: '1'
  pages: 330–363
  year: '2025'
  date: 2025-01
  doi: 10.1257/aer.20210307
  links:
  - label: Published version
    source: American Economic Review
    url: https://www.aeaweb.org/articles?id=10.1257/aer.20210307
  - label: Working paper version
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3600583
  abstract: >-
    We document a robust dynamic inconsistency in risky choice. Using a unique brokerage dataset and a
    series of experiments, we compare people’s initial risk-taking plans to their subsequent decisions.
    Across settings, people accept risk as part of a “loss-exit” strategy — planning to continue taking
    risk after gains and stopping after losses. Actual behavior deviates from initial strategies by cutting
    gains early and chasing losses. More people accept risk when offered a commitment to their initial
    strategy. Our results help reconcile seemingly contradictory findings on risk-taking in static versus
    dynamic contexts. We explore implications for theory and welfare.
  lead: >-
    Risk preferences are dynamically inconsistent: people’s plans for taking risk differ systematically
    from what they do once gains or losses arrive.
  brief: >-
    Using brokerage account data and a series of experiments, the paper shows that people typically plan
    to keep taking risk after gains and to stop after losses, but in practice they do the reverse: they
    cash out gains early and keep chasing losses. When offered a way to commit to their original plan,
    more people are willing to take the risk in the first place. The findings help reconcile why studies
    of one-shot gambles and studies of ongoing, repeated risk-taking often reach different conclusions
    about people’s appetite for risk.
  keywords: >-
    time inconsistency, risk preferences, dynamic inconsistency, risk-taking, loss chasing, realization
    of gains, commitment devices, prospect theory, brokerage data, lab experiments
  topics:
  - retail-investing-brokerage
  - behavioral-finance-beliefs
  finding: >-
    Risk-taking is dynamically inconsistent: people plan to keep taking risk after gains and stop after
    losses, but instead cash out gains early and chase losses, in experiments and brokerage data.
  glance:
    design:
    - - Question
      - Do people follow through on their plans for taking risk once gains or losses arrive?
    - - Setting
      - Retail brokerage accounts and a series of experiments
    - - Data
      - A unique brokerage dataset and experimental choices
    - - Method
      - >-
        Comparison of people’s initial risk-taking plans with their later decisions, including when a
        commitment to the plan is offered
    effects_title: Main findings
    numeric: false
    effects:
    - - Planned strategy
      - Keep taking risk after gains, stop after losses
    - - Actual behavior
      - Cash out gains early and chase losses
    - - Offering commitment to the plan
      - More people accept the risk
  contributes:
  - time-inconsistent preferences
  - risk preferences and prospect theory
  - commitment devices
  - realization of gains and losses
- slug: shale-shocked-cash-windfalls-household-debt
