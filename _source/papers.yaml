  abstract: >-
    Restricting credit access protects borrowers from financial mistakes, but limits the accumulation
    of credit history that lenders use to extend future credit. We study these competing forces using
    the Credit Card Accountability Responsibility and Disclosure (CARD) Act of 2009, which barred credit
    card issuance to individuals under age 21 without a cosigner or verified income. Exploiting cohort-based
    variation in exposure with an adjacent-cohorts design that controls for secular trends, we trace long-run
    credit outcomes using credit bureau data. The CARD Act reduced early card ownership and severe delinquency
    substantially, at the cost of a temporary credit score deficit in the early twenties. By age 30, treated
    individuals are 2–4 percentage points more likely to hold prime or super-prime credit scores and 5–6
    percentage points more likely to own a home, but at the cost of increased mortgage delinquency. An
    instrumental variables decomposition reveals that protection from early delinquency drives the credit
    score and homeownership gains, while credit exclusion generates adverse selection into the mortgage
    market — borrowers who never had the opportunity to reveal their credit risk through card delinquency
    appear creditworthy on paper but default at elevated rates.
  lead: >-
    Restricting credit protects young borrowers from early mistakes but keeps lenders from learning who
    is risky, a tradeoff that shapes credit outcomes for years.
  brief: >-
    The paper studies the Credit CARD Act of 2009, which barred card issuance to people under 21 without
    a cosigner or verified income, and follows affected cohorts into their early thirties in credit bureau
    data. The Act cut early card ownership and severe delinquency, at the cost of a temporary credit score
    deficit in the early twenties. By age 30, affected individuals were 2 to 4 percentage points more
    likely to have prime or super-prime scores and 5 to 6 percentage points more likely to own a home.
    Their mortgages defaulted more often, however: people who never had a chance to reveal their credit
    risk on a card looked creditworthy on paper.
  keywords: >-
    credit history, information in lending, Credit CARD Act, young adults, credit card access, consumer
    credit, credit scores, homeownership, mortgage delinquency, adverse selection, credit bureau data
  topics:
  - consumer-credit-debt
