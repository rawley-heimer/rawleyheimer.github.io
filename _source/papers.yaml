  abstract: >-
    We study the effect of personal wealth on entrepreneurial decisions using data on mineral payments
    from Texas shale drilling to individuals throughout the United States. Large cash windfalls increase
    business formation by 0.8 to 2.1 percentage points, but do not affect transitions to self-employment.
    By contrast, cash windfalls significantly extend self-employment spells, but do not affect the duration
    of business ownership. Our findings help reconcile contrasting findings in prior work: liquidity constraints
    have different effects on entrepreneurial activity that may depend on the entrepreneur’s motivations.
  lead: >-
    More personal wealth leads people to start businesses but not to become self-employed, so liquidity
    constraints affect different kinds of entrepreneurs differently.
  brief: >-
    Windfalls do let people who are already self-employed stay self-employed longer, while having no effect
    on how long business owners keep their businesses. Liquidity constraints therefore matter differently
    depending on what motivates the would-be entrepreneur, which helps reconcile conflicting results in
    earlier research.
  keywords: >-
    wealth effects, entrepreneurship, liquidity constraints, business formation, self-employment, cash
    windfalls, shale royalties, personal wealth
  topics:
  - saving-retirement-inheritance
  finding: >-
    More personal wealth raises business formation but not transitions to self-employment, suggesting
    liquidity constraints matter differently for different kinds of entrepreneurs; evidence from shale
    mineral payments.
  glance:
    design:
    - - Question
      - Does personal wealth lead people to start businesses or become self-employed?
    - - Setting
      - Mineral payments from Texas shale drilling to individuals across the United States
    - - Method
