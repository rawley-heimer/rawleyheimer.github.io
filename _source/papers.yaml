  abstract: >-
    Using the Federal Reserve Bank of New York’s Survey of Consumer Expectations, we document that people
    expect significantly lower personal exposure to COVID-19 than they attribute to the general public
    — a gap of 17.5 percentage points at the three-month horizon. This overconfidence is stronger among
    higher-income and younger households and fades over longer horizons. Overconfidence is distinct from
    absolute confidence: high-income respondents still perceive greater personal risk than low-income
    respondents, even while perceiving themselves as less exposed than the public. These behavioral biases
    may have contributed to the difficulty of containing the virus.
