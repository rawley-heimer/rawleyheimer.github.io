    This research is the first to provide empirical evidence that social interaction is more prevalent
    amongst active rather than passive investors. While previous empirical work, spearheaded by Hong,
    Kubik, and Stein (2004), shows that proxies for sociability are related to participation in asset
    markets, the literature is unable to distinguish between the types of participants because of data
