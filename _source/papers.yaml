  - Mateo Velásquez-Giraldo
  kind: working
  status: unposted
  year: '2026'
  date: 2026-10
  links: []
  abstract: >-
    Inheritances account for a quarter to a half of U.S. household wealth, yet the canonical life-cycle
    model of saving omits them. We extend the model so that households have a living parent whose wealth
    evolves stochastically and who leaves an inheritance at death, and we calibrate parental mortality,
    parental wealth dynamics, and inheritance slippage using the SCF, PSID, and HRS. Inheritances generate
    large, positive income shocks whose probability, size, and timing are all uncertain. Omitting them
    leads to an overestimate of the discount factor (0.947 versus 0.933), a difference that compounds
    substantially over life-cycle horizons. Anticipated inheritances raise the level and dispersion of
    consumption at all ages, lower saving among younger households, and increase wealth inequality before
    about age 60. Consistent with the model, households with wealthier parents consume more, all else
    equal. Households would pay substantial amounts to receive their inheritance today, particularly when
    their parents are wealthy.
  lead: >-
    Leaving inheritances out of the life-cycle model makes households look more patient than they are;
    expected inheritances change saving long before the money arrives.
  brief: >-
    The paper adds inheritances to a standard life-cycle model of saving: households have a living parent
    whose wealth changes over time and who leaves an inheritance at death, with parental mortality, wealth,
    and the share lost to taxes and fees calibrated from the SCF, PSID, and HRS. Inheritances act as large,
    positive income shocks whose size, probability, and timing are all uncertain. Leaving them out makes
    the model overstate how patient households are. Including them raises consumption and its spread at
    all ages, mostly through anticipation, and raises wealth inequality among younger households. Households
    would pay substantial sums to receive their inheritance today, especially when their parents are wealthy.
  keywords: >-
    time discounting, income risk, inheritances, bequests, life-cycle model, household saving, consumption,
    wealth inequality, discount factor, parental wealth, intergenerational transfers
  topics:
  - saving-retirement-inheritance
  finding: >-
    Life-cycle models that omit inheritances overstate how patient households are; expected inheritances
    raise consumption and lower saving long before they arrive.
