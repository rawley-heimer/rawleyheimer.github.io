  - label: Working paper version
    source: SSRN
    url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3042896
  abstract: >-
    Powerful politicians can interfere with the enforcement of regulations. As such, expected political
    interference can affect constituents’ behavior. Using rotations of Senate committee chairs to identify
    variation in political power and expected regulatory relief, we study powerful politicians’ effect
    on consumer lending to communities protected by fair-lending regulations. We find a 7.5% reduction
    in credit access to minority neighborhoods in states with new committee chairs. Larger reductions
    occur in Community Reinvestment Act-eligible neighborhoods and when Senators serve on committees that
    oversee the enforcement of fair-lending laws. Banks headquartered in powerful Senators’ states are
    responsible for the reduction in credit access.
  lead: >-
    Expected political interference with regulation changes how regulated firms behave: when politicians
    can shield banks from fair-lending enforcement, banks lend less to protected communities.
  brief: >-
    When a state’s senator becomes chair of a Senate committee, credit access to minority neighborhoods
    in that state falls by 7.5%. The declines are larger in neighborhoods eligible under the Community
    Reinvestment Act and when the senator’s committee oversees fair-lending enforcement, and they are
    driven by banks headquartered in the senator’s home state. Expected regulatory relief, not only formal
    changes to the rules, shapes who gets credit.
  keywords: >-
    political economy of regulation, bank lending, fair lending, Community Reinvestment Act, political
    economy, Senate committee chairs, regulatory enforcement, minority neighborhoods, credit access, mortgage
    lending
  topics:
  - consumer-protection-regulation
  - consumer-credit-debt
  - mortgage-lending-housing
  - legal-regulatory-institutions
  - local-banking-access-to-finance
  finding: >-
    Expected political interference weakens regulation: when a state’s senator becomes a powerful committee
    chair, credit to the state’s minority neighborhoods falls by 7.5%, driven by banks headquartered in
    the state.
  glance:
