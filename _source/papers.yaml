    source: MIT DSpace
    url: https://hdl.handle.net/1721.1/134174
  - label: Earlier version
    source: NBER Working Paper 24176
    url: https://www.nber.org/papers/w24176
  abstract: >-
    Does the provision of leverage to retail traders improve market quality or facilitate socially inefficient
    speculation that enriches financial intermediaries? We evaluate the effects of 2010 regulations that
    cap leverage in the U.S. retail foreign exchange market. Using three unique data sets and a difference-in-differences
    approach, we document that the leverage constraint reduces trading volume by 23%, alleviates high-leverage
    traders’ losses by 40%, and reduces brokerages’ operating capital by 25%. Yet, the policy does not
    affect the relative bid-ask prices charged by the brokerages. These results suggest the policy improves
    belief-neutral social welfare without reducing market liquidity.
  lead: >-
    Capping how much leverage retail traders can use made them better off without harming market liquidity.
  brief: >-
    The paper studies 2010 U.S. rules that limited leverage in the retail foreign exchange (forex) market.
    The cap cut trading volume by 23%, reduced high-leverage traders’ losses by 40%, and shrank brokerages’
    operating capital by 25%, yet brokerages did not raise the bid-ask spreads they charged. The authors
    conclude that the policy improved (belief-neutral) social welfare without reducing market liquidity.
  keywords: >-
    retail investors, retail trading, margin and leverage, leverage limits, retail forex trading, Dodd-Frank,
    speculation, financial regulation, market liquidity, brokerages, difference-in-differences, social
    trading network
  topics:
  - retail-investing-brokerage
  - consumer-protection-regulation
  - social-media-finance
  finding: >-
    Limiting retail investors’ access to leverage cut high-leverage traders’ losses by 40% without reducing
    market liquidity, based on the 2010 U.S. leverage cap in the retail forex market.
